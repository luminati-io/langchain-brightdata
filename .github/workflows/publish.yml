name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false
  # Keep every waiting run; the default keeps one and cancels older waiting runs.
  queue: max

jobs:
  tests:
    name: tests
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] ./ runs this commit; actionlint rejects $/
    permissions:
      contents: read

  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the guard reads the pypi environment (GitHub API: Actions read)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, so refs/remotes/origin/main exists for the guard's
          # check that the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Keep in sync with the packaging pin in ci.yml.
      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Run the release guard
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py --tag "$TAG"

  build:
    name: build
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install build==1.6.1

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist holds exactly the wheel and sdist for the tag
        run: |
          V="${TAG#v}"
          expected="$(printf '%s\n' "langchain_brightdata-$V-py3-none-any.whl" "langchain_brightdata-$V.tar.gz" | LC_ALL=C sort)"
          actual="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "dist/ holds:"
            echo "$actual"
            echo "expected:"
            echo "$expected"
            exit 1
          fi
          echo "dist/ holds exactly:"
          echo "$actual"

      - name: Install the wheel in a fresh venv and import it
        run: |
          V="${TAG#v}"
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install "dist/langchain_brightdata-$V-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" - "$V" <<'EOF'
          import sys
          from importlib.metadata import version

          import langchain_brightdata
          from langchain_brightdata import BrightDataSERP, BrightDataUnlocker, BrightDataWebScraperAPI

          print("imported", BrightDataSERP.__name__, BrightDataUnlocker.__name__,
                BrightDataWebScraperAPI.__name__, "from", langchain_brightdata.__file__)
          installed = version("langchain-brightdata")
          if installed != sys.argv[1]:
              sys.exit(f"installed version is {installed}, expected {sys.argv[1]}")
          print("installed version is", installed)
          EOF

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [tests, guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-brightdata
    permissions:
      id-token: write # PyPI trusted publishing and attestations
    # No checkout: this job uploads only the files the build job checked.
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The upload stays in this file: the PyPI trusted publisher is bound to
      # publish.yml, and PyPI does not accept uploads from a reusable workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
