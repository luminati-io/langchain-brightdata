name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its older run. Every other run (main, release) gets
  # its own group, so none is cancelled while queued. The ci- prefix keeps this
  # group apart from a calling workflow's own group.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No setup-python cache: the release workflow calls this one, and caches in a
# release path can be poisoned.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Keep in sync with the ruff pin in pyproject.toml.
      - name: Install ruff
        run: python -m pip install ruff==0.16.10

      - name: Run ruff
        run: ruff check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 has no Ubuntu 26.04 build, and ubuntu-latest moves to 26.04
          # from 2026-10-19, so the 3.9 leg stays on 24.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Keep in sync with the packaging pin in publish.yml.
      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Run the release guard
        run: python scripts/release_guard.py --pr

  # Real Bright Data calls, one per tool. Observe mode: this job reports but does
  # not block, and ci-ok does not need it. A run without the key says "not
  # checked" instead of passing. Pull requests from forks never get the key.
  live:
    name: live (observe)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run live tests
        env:
          BRIGHTDATA_TEST_API_KEY: ${{ secrets.BRIGHTDATA_TEST_API_KEY }}
        run: |
          if [ -z "$BRIGHTDATA_TEST_API_KEY" ]; then
            echo "::warning title=Live tests not checked::BRIGHTDATA_TEST_API_KEY is not available to this run."
            echo "Live tests: not checked (no key)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m pytest -m live tests/integration_tests -rA --tb=short

  # The one check a branch rule requires. It fails unless every job above
  # succeeded, so a failed, cancelled or skipped job cannot pass as green.
  ci-ok:
    name: ci-ok
    needs: [lint, test, guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check job results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GUARD_RESULT: ${{ needs.guard.result }}
        run: |
          echo "lint: $LINT_RESULT"
          echo "test: $TEST_RESULT"
          echo "guard: $GUARD_RESULT"
          if [ "$LINT_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] ||
            [ "$GUARD_RESULT" != "success" ]; then
            echo "Not every job succeeded."
            exit 1
          fi
